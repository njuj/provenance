<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace"><defs><style>.n{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.flow{stroke-dasharray:6 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.glow{animation:gl 2.6s ease-in-out infinite}@keyframes gl{50%{opacity:.35}}</style><radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ffd166" stop-opacity=".22"/><stop offset=".6" stop-color="#ffd166" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="1280" height="440" rx="18" fill="#0b0f17"/><rect width="1280" height="440" rx="18" fill="url(#grid)"/><rect width="1280" height="440" rx="18" fill="url(#g)"/><rect x="48" y="44" width="6" height="58" rx="3" fill="#ffd166"/><text x="72" y="70" font-size="13" letter-spacing="4" fill="#6e7681">NJUJ / TOOL</text><text x="72" y="104" font-size="40" font-weight="800" fill="#f0f3f6">provenance</text><text x="72" y="140" font-size="17" fill="#ffd166">Is the package on npm or PyPI the code in its repository?</text><g class="n" style="animation-delay:0.25s"><rect x="72" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="320" y="226" text-anchor="end" font-size="12" fill="#3d4757">01</text><g transform="translate(92 216) scale(1.6)" fill="none" stroke="#ffd166" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M3 7l9 5 9-5M12 12v10"/></g><text x="92" y="294" font-size="17" font-weight="700" fill="#f0f3f6">npm / PyPI release</text><text x="92" y="322" font-size="13" fill="#8b949e">the tarball or wheel</text><text x="92" y="342" font-size="13" fill="#8b949e">you would install</text></g><path class="flow" d="M342 280.0 H370" stroke="#ffd166" stroke-width="2" fill="none" opacity=".8"/><path d="M364 275.0 l6 5 -6 5" stroke="#ffd166" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.60s"><rect x="376" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="624" y="226" text-anchor="end" font-size="12" fill="#3d4757">02</text><g transform="translate(396 216) scale(1.6)" fill="none" stroke="#ffd166" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 7.2v9.6M18 11.2c0 4-6 3-11 6"/></g><text x="396" y="294" font-size="17" font-weight="700" fill="#f0f3f6">The exact commit</text><text x="396" y="322" font-size="13" fill="#8b949e">the repository at the</text><text x="396" y="342" font-size="13" fill="#8b949e">commit it was built from</text></g><path class="flow" d="M646 280.0 H674" stroke="#ffd166" stroke-width="2" fill="none" opacity=".8"/><path d="M668 275.0 l6 5 -6 5" stroke="#ffd166" stroke-width="2" fill="none"/><g class="n" style="animation-delay:0.95s"><rect x="680" y="196" width="266" height="168" rx="14" fill="#111722" stroke="#1f2a3a" stroke-width="1.2"/><text x="928" y="226" text-anchor="end" font-size="12" fill="#3d4757">03</text><g transform="translate(700 216) scale(1.6)" fill="none" stroke="#ffd166" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v10M1 9h8M15 9h8M8 20h8"/><path d="M12 2v6"/></g><text x="700" y="294" font-size="17" font-weight="700" fill="#f0f3f6">File-by-file diff</text><text x="700" y="322" font-size="13" fill="#8b949e">what is in the release</text><text x="700" y="342" font-size="13" fill="#8b949e">but not in the repo</text></g><path class="