[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-check"
dynamic = ["version"]
description = "Check that a package on npm or PyPI is the code in its repository: install scripts, dependencies and code that appear only at publish time, traced through signed build provenance and source maps. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["supply-chain", "security", "npm", "pypi", "provenance", "slsa", "sbom", "malware", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/provenance"

[project.scripts]
provenance = "provenance.cli:main"

[tool.setuptools.dynamic]
version = { attr = "provenance.__version__" }

[tool.setuptools.packages.find]
include = ["provenance*"]

